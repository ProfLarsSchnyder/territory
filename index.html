<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080d1c">
<meta name="description" content="Territory Clash: Ein schnelles taktisches Strategiespiel für dein Handy.">
<title>Territory Clash</title>
<style>
:root{color-scheme:dark;--bg:#080e1e;--surface:#101a30;--line:#263651;--cyan:#4de5ec;--blue:#2678ff;--coral:#ff755f;--violet:#ad91ff;--ink:#eef6ff;--muted:#8494b2;--good:#63f5ba}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);touch-action:manipulation}
body:before{content:"";position:fixed;inset:-20%;z-index:0;background:radial-gradient(ellipse at 14% 14%,#21406b70 0,transparent 38%),radial-gradient(ellipse at 90% 65%,#47234555 0,transparent 38%),radial-gradient(ellipse at 48% 94%,#16486c33 0,transparent 42%);pointer-events:none;animation:ambience 14s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;opacity:.16;background-image:linear-gradient(#aacfff14 1px,transparent 1px),linear-gradient(90deg,#aacfff14 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
@keyframes ambience{to{transform:translate(3%, -3%) scale(1.07)}}
button{font:inherit;color:inherit;cursor:pointer}
.app{isolation:isolate;position:relative;z-index:1;max-width:510px;margin:auto;height:100dvh;min-height:0;padding:calc(env(safe-area-inset-top) + 13px) 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.topbar,.section-head,.board-meta,.bottom-top{display:flex;align-items:center;justify-content:space-between}
.topbar{min-height:39px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:35px;height:35px;display:grid;place-items:center;background:linear-gradient(145deg,#43e7e5,#3274fe);border-radius:11px;color:#071020;font-size:23px;font-weight:1000;box-shadow:0 5px 20px #20c6f75c;transform:rotate(-8deg)}
.brand-word{font-weight:950;letter-spacing:.11em;font-size:16px}
.brand-word em{font-style:normal;color:var(--cyan)}
.brand-sub{font-size:9px;text-transform:uppercase;letter-spacing:.29em;color:var(--muted);margin-top:3px;font-weight:700}
.top-actions{display:flex;gap:7px}
.icon-btn{width:36px;height:36px;border:1px solid #354767;background:#111c32e0;border-radius:12px;display:grid;place-items:center;font-size:17px;transition:transform .18s,background .18s}
.icon-btn:active{transform:scale(.92);background:#253a59}
.score-row{display:grid;grid-template-columns:1fr 62px 1fr;gap:7px;min-height:80px}
.scorecard{position:relative;overflow:hidden;background:linear-gradient(140deg,#122944dd,#11192bd9);border:1px solid #31577b;border-radius:17px;padding:11px 10px;display:flex;flex-direction:column;gap:5px}
.scorecard.enemy{background:linear-gradient(140deg,#351f36dd,#18172add);border-color:#785069;text-align:right}
.scorecard.current{box-shadow:0 0 0 1px #49d5ecaa,0 0 18px #39d6ff20}
.scorecard.enemy.current{box-shadow:0 0 0 1px #fd927eaa,0 0 18px #ff746b20}
.score-title{font-size:10px;letter-spacing:.13em;font-weight:900;color:#74ddec;text-transform:uppercase;white-space:nowrap}
.enemy .score-title{color:#ff9c85}
.score-number{font-size:27px;font-weight:950;line-height:1;letter-spacing:-.065em;font-variant-numeric:tabular-nums}
.score-caption{font-size:10px;color:#9cacc4;font-weight:650}
.round-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.round-box span{font-size:9px;letter-spacing:.12em;font-weight:850;color:#7b8ca9}
.round-box strong{font-size:24px;font-weight:950;font-variant-numeric:tabular-nums}
.round-box small{font-size:10px;color:#7889a5}
.arena{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;flex:1;gap:8px}
.section-head{width:100%;max-width:440px}
.section-head b{font-size:10px;letter-spacing:.2em;color:#bccadd}
.section-head small{font-size:10px;font-weight:750;color:var(--muted)}
.live-dot{display:inline-block;background:var(--good);width:6px;height:6px;margin-right:6px;border-radius:50%;box-shadow:0 0 10px var(--good)}
.board-shell{width:min(calc(100vw - 36px), calc((100dvh - 394px) * .875), 438px);max-width:100%;aspect-ratio:7/8;padding:7px;background:linear-gradient(140deg,#2d4160aa,#141e33 55%,#4a31545e);border:1px solid #3b4e6a;border-radius:22px;box-shadow:0 18px 45px #020613bf,0 0 30px #2678ff19,inset 0 1px #bcdcff2e;position:relative}
.board-shell:before,.board-shell:after{position:absolute;content:"";pointer-events:none;z-index:2;width:28px;height:28px;border-color:#5ce4ef;opacity:.7}
.board-shell:before{top:-4px;left:-4px;border-top:2px solid;border-left:2px solid;border-radius:22px 0 0 0}
.board-shell:after{right:-4px;bottom:-4px;border-right:2px solid;border-bottom:2px solid;border-radius:0 0 22px 0}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:4px;width:100%;height:100%}
.tile{min-width:0;min-height:0;border:1px solid #34435c;background:linear-gradient(160deg,#24324b,#19253c);border-radius:clamp(6px,2vw,11px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset 0 1px #d0e9ff10;transition:transform .16s,border-color .16s,filter .16s,box-shadow .16s}
.tile:active:not(:disabled){transform:scale(.91)}
.tile.neutral{background:linear-gradient(150deg,#26334b,#1c283e)}
.tile.player{background:linear-gradient(150deg,#159dbf,#126397 65%,#163e7c);border-color:#55dff1a6;box-shadow:inset 0 1px #ffffff55,0 0 10px #2fd8ef17}
.tile.enemy{background:linear-gradient(150deg,#df7261,#b84f66 58%,#723863);border-color:#ffaf91a6;box-shadow:inset 0 1px #ffffff55,0 0 10px #fc6c7617}
.tile.rock{background:repeating-linear-gradient(140deg,#192235,#192235 6px,#1b283b 6px,#1b283b 12px);border-color:#29364a;cursor:default}
.tile.rock:after{content:"";width:18%;height:18%;background:#667a96;opacity:.5;transform:rotate(45deg);border:1px solid #b5c6da}
.tile.selected{border-color:#e6fbff;box-shadow:0 0 0 2px #e4fcff,0 0 21px #4ce4eb9f,inset 0 1px #ffffff77;z-index:1;transform:scale(1.045)}
.tile.legal{border-color:#f4ffffaa;box-shadow:inset 0 0 0 1px #edfaff46,0 0 14px #4de5ec4e;animation:hint 1.45s ease-in-out infinite}
.tile.legal.enemy{box-shadow:inset 0 0 0 1px #ffeddc55,0 0 17px #ff78675c}
@keyframes hint{50%{filter:brightness(1.35)}}
.tile.flash{animation:pop .43s ease-out}
@keyframes pop{0%{transform:scale(.68);filter:brightness(2.5)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.tile-power{position:relative;font-size:clamp(12px,4.2vw,22px);font-weight:950;text-shadow:0 2px 8px #0d163462;line-height:1;font-variant-numeric:tabular-nums}
.tile.neutral .tile-power{color:#51637f;font-size:17px}
.tile-energy{position:absolute;top:2px;right:3px;color:#f7d56c;font-size:clamp(9px,2.5vw,13px);filter:drop-shadow(0 0 5px #ffc654)}
.tile-base{position:absolute;top:2px;left:3px;color:#fff5c2;font-size:clamp(9px,2.5vw,12px)}
.tile.player .tile-power,.tile.enemy .tile-power{color:#fff}
.board-meta{max-width:440px;width:100%;font-size:10px;letter-spacing:.01em;color:#8798b2;font-weight:700}
.board-meta strong{color:#f8d277}
.status{min-height:47px;background:#111c31c9;border:1px solid #293a55;border-radius:13px;display:flex;align-items:center;gap:9px;padding:9px 11px}
.status-orb{width:9px;height:9px;flex-shrink:0;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px var(--cyan)}
.status.enemy-turn .status-orb{background:var(--coral);box-shadow:0 0 13px var(--coral)}
.status-text{flex:1;min-width:0;font-size:11px;font-weight:720;color:#d9e7f7;line-height:1.3}
.ap-wrap{display:flex;gap:4px}
.ap-pip{width:8px;height:16px;border-radius:3px;background:#2b3b58}
.ap-pip.filled{background:linear-gradient(#72fcf1,#2cb7d1);box-shadow:0 0 8px #40e8f45e}
.status.enemy-turn .ap-pip.filled{background:linear-gradient(#ffc0a6,#f16c72);box-shadow:0 0 8px #ff7f6c60}
.control-panel{background:#111c30e8;border:1px solid #2a3b54;border-radius:18px;padding:10px;box-shadow:0 10px 30px #05091669}
.bottom-top{margin:0 2px 9px;font-size:10px;color:#a3b4ca;font-weight:850}
.bottom-top strong{color:#f7fbff;letter-spacing:.07em;font-size:10px}
.action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.action{height:62px;border:1px solid #364962;background:linear-gradient(160deg,#1c304b,#17253e);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:840;transition:background .15s,transform .15s,border-color .15s}
.action .glyph{font-size:18px;line-height:1}.action small{font-size:10px;color:#ffdc88;font-weight:900}.tile.inspected:not(.selected){outline:1px solid #a6d9f677;outline-offset:-2px}
.action.on{background:linear-gradient(155deg,#164e71,#193256);border-color:#56dbea;box-shadow:inset 0 0 0 1px #4ddef82c,0 0 18px #2dc6ed22}
.action.attack.on{background:linear-gradient(155deg,#694050,#38253a);border-color:#ff9583;box-shadow:0 0 18px #ff74631a}
.action.boost.on{background:linear-gradient(155deg,#554875,#292749);border-color:#c7aaff}
.action:active{transform:scale(.96)}
.action:disabled{opacity:.45}
.footbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.end-btn{font-size:11px;letter-spacing:.07em;font-weight:900;color:#aabed7;border:0;background:none;padding:3px 12px}
.mine-btn{font-size:11px;font-weight:850;color:#f9dfa0;border:1px solid #aa854d;background:#533c2059;border-radius:9px;padding:7px 11px}
.mine-btn:disabled{opacity:.45}
[hidden]{display:none!important}
.end-btn:disabled{opacity:.3}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translate(-50%,-12px);background:#f2f8ff;color:#10243e;border-radius:14px;padding:11px 17px;font-weight:850;font-size:12px;max-width:calc(100vw - 44px);text-align:center;opacity:0;transition:all .2s;pointer-events:none;z-index:30;box-shadow:0 8px 30px #0008}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-shell{position:fixed;inset:0;z-index:20;background:#030916d9;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-shell.hidden{display:none}
.modal{max-width:400px;width:100%;position:relative;overflow:hidden;border:1px solid #43607f;background:linear-gradient(160deg,#172c49,#101b31 53%,#281d35);padding:26px 23px;border-radius:27px;box-shadow:0 25px 75px #000b,0 0 60px #2c87ec28;text-align:center}
.modal:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,#39dcfc24,transparent 54%)}
.modal>*{position:relative}
.hero-emblem{width:84px;height:84px;margin:0 auto 16px;border-radius:25px;background:linear-gradient(145deg,#53f2df,#386eff 75%);display:grid;place-items:center;transform:rotate(-9deg);box-shadow:0 12px 35px #37baff4e,inset 0 2px #ffffff88}
.hero-emblem span{font-size:58px;color:#071327;font-weight:1000;transform:rotate(9deg);line-height:1}
.eyebrow{font-size:10px;color:#81e7ed;letter-spacing:.28em;font-weight:950;margin-bottom:7px}
.modal h1{font-size:clamp(30px,8vw,40px);margin:0 0 6px;letter-spacing:-.055em;font-weight:1000}
.modal h1 span{color:#63e9e8}
.modal p{font-size:13px;line-height:1.65;color:#acbed4;margin:11px 0 22px}
.hero-facts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.hero-facts span{font-size:10px;color:#a8d8e9;background:#132e49;border:1px solid #2d5878;border-radius:99px;padding:7px 9px;font-weight:850}
.primary-btn,.secondary-btn{width:100%;height:52px;border-radius:14px;font-size:14px;font-weight:950;letter-spacing:.01em}
.primary-btn{background:linear-gradient(110deg,#5cebdc,#43a2f6);border:0;color:#071a2c;box-shadow:0 8px 22px #4fdbf537}
.secondary-btn{margin-top:9px;border:1px solid #4b5d78;background:#1d2c45;color:#e3eefa}
.primary-btn:active,.secondary-btn:active{transform:scale(.98)}
.modal .fine{font-size:10px;color:#7d91a9;margin:16px 0 0}
.rules{text-align:left;font-size:13px;line-height:1.55;color:#c7d7e9;display:grid;gap:12px;margin:20px 0}
.rules div{background:#1b304a;border:1px solid #324b68;border-radius:13px;padding:11px 12px}
.rules b{color:#6fe6ed}
.result-score{font-size:37px;font-weight:950;letter-spacing:-.04em;margin:17px 0;color:#a5f0f6}
.result-score small{font-size:14px;color:#89a2bb}
@media(max-height:710px){.app{gap:5px;padding-top:calc(env(safe-area-inset-top) + 7px);padding-bottom:calc(env(safe-area-inset-bottom) + 5px)}.score-row{min-height:67px}.scorecard{padding:8px}.score-number{font-size:23px}.section-head{display:none}.arena{gap:5px}.board-shell{width:min(calc(100vw - 36px),calc((100dvh - 390px) * .875),438px)}.status{min-height:40px;padding:6px 10px}.control-panel{padding:7px}.bottom-top{margin-bottom:6px}.action{height:49px}.footbar{margin-top:4px}}
@media(max-height:610px){.brand-sub,.board-meta{display:none}.footbar{margin-top:2px}.board-shell{width:min(calc(100vw - 36px),calc((100dvh - 354px) * .875),438px)}.score-row{min-height:55px}.score-caption{display:none}.scorecard{justify-content:center}.status{min-height:34px}.action{height:45px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.coin-balance{display:inline-block;border:1px solid #ac873d;background:#866b2b40;color:#ffdd7c;padding:5px 8px;font-size:19px;font-weight:950;border-radius:10px;line-height:1}
.inspector{min-height:54px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:7px 11px;border:1px solid #3e5370;border-radius:13px;background:#1b2b43}
.inspector b{font-size:12px}.inspector span{font-size:10px;line-height:1.35;color:#b8cce3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-height:710px){.inspector{min-height:44px;padding:5px 8px}.action{height:52px}}
.tile-building{position:absolute;left:2px;bottom:1px;font-size:13px}.tile.warp{border-color:#a57fe6}
.build-list{display:grid;gap:7px;margin:12px 0;text-align:left}.build-item{display:flex;align-items:center;gap:8px;width:100%;min-height:64px;background:#1d314b;border:1px solid #425b79;border-radius:13px;padding:10px;text-align:left}.build-item:disabled{opacity:.4}.build-ico{width:30px;font-size:23px}.build-copy{flex:1;min-width:0}.build-copy b{display:block;font-size:12px}.build-copy small{display:block;font-size:10px;color:#b6cce2;line-height:1.4}.build-item>strong{font-size:12px;white-space:nowrap;color:#ffe08a}.build-note{font-size:11px!important;margin:8px 0!important}.inspect-more{align-self:flex-start;background:transparent;border:0;color:#8fdee9;font-size:11px;font-weight:850;padding:1px 0;margin-top:1px}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">T</div><div><div class="brand-word">TERRITORY <em>CLASH</em></div><div class="brand-sub">Tactical Grid Warfare</div></div></div>
    <div class="top-actions"><button class="icon-btn" id="sound" aria-label="Ton ein- oder ausschalten" title="Ton">♪</button><button class="icon-btn" id="info" aria-label="Spielregeln" title="Regeln">?</button><button class="icon-btn" id="restart" aria-label="Neues Spiel" title="Neues Spiel">↻</button></div>
  </header>
  <section class="score-row" aria-label="Spielstand">
    <div class="scorecard current" id="player-card"><span class="score-title" id="p-name">◆ DU · STÄRKE</span><strong class="score-number" id="p-count">3</strong><span class="coin-balance" id="p-money">🪙 8</span><span class="score-caption" id="p-meta">1 Feld</span></div>
    <div class="round-box"><span>RUNDE</span><strong id="round">01</strong><small>/ 15</small></div>
    <div class="scorecard enemy" id="enemy-card"><span class="score-title" id="e-name">STÄRKE · KI ◆</span><strong class="score-number" id="e-count">3</strong><span class="coin-balance" id="e-money">🪙 8</span><span class="score-caption" id="e-meta">1 Feld</span></div>
  </section>
  <section class="arena">
    <div class="section-head"><b>SEKTOR 07</b><small><span class="live-dot"></span>GEBIETSKONTROLLE</small></div>
    <div class="board-shell"><div id="board" class="board" role="grid" aria-label="Taktisches Spielfeld mit sieben Spalten und acht Reihen"></div></div>
    <div class="board-meta"><span>◆ Hauptquartier</span><span>⛏ Mine</span><span>✦ Schatz</span><span>🌀 Warp</span></div>
  </section>
  <section class="inspector"><b id="inspect-title">Feld antippen</b><span id="inspect-desc">Hier werden Feldboni und Gebäude erklärt.</span><button class="inspect-more" id="inspect-more" aria-label="Alle Feldinformationen">ⓘ Details</button></section><section class="status" id="status"><span class="status-orb"></span><div id="status-text" class="status-text" aria-live="polite">Wähle ein eigenes Feld.</div><div id="ap" class="ap-wrap" aria-label="Aktionspunkte"></div></section>
  <section class="control-panel">
    <div class="bottom-top"><strong id="turn-label">DEIN ZUG</strong><span id="ap-label">1 AKTION ÜBRIG</span></div>
    <div class="action-grid">
      <button class="action on" id="expand"><span class="glyph">✧</span><span>Erobern</span><small>1 Aktion</small></button>
      <button class="action attack" id="attack"><span class="glyph">⚔</span><span>Angreifen</span><small>1 Aktion</small></button>
      <button class="action boost" id="boost"><span class="glyph">⬡</span><span>Verstärken</span><small id="boost-cost">2 🪙</small></button><button class="action" id="build"><span class="glyph">⌂</span><span>Bauen</span><small>mit 🪙</small></button>
    </div>
    <div class="footbar"><button class="mine-btn" id="mine-upgrade" hidden>⛏ Mine verbessern</button><button class="end-btn" id="end-turn">ZUG BEENDEN ›</button></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="modal-shell" id="overlay"><div class="modal" id="modal"></div></div>
<script>
(function(){
  "use strict";
  var COLS=7,ROWS=8,MAX_ROUNDS=15,BOOST_COST=2;
  var rocks=[15,19,24,31,36,40];
  var mines=[17,38],treasures=[22,33],warps=[9,20,35,46];
  var board=[],mode="ai",turn=1,round=1,ap=1,maxAp=1,selected=null,inspected=null,action="expand",coins={1:8,2:8};
  var locked=false,pendingTurn=false,gameOver=false,lastMove=-1,mute=true,audio=null,timer=null,gameToken=0,aiHasSpent=false;
  var els={board:document.getElementById("board"),overlay:document.getElementById("overlay"),modal:document.getElementById("modal"),toast:document.getElementById("toast")};
  function byId(id){return document.getElementById(id)}
  function getXY(i){return {r:Math.floor(i/COLS),c:i%COLS}}
  function neighbors(i){var p=getXY(i),a=[];if(p.r>0)a.push(i-COLS);if(p.r<ROWS-1)a.push(i+COLS);if(p.c>0)a.push(i-1);if(p.c<COLS-1)a.push(i+1);return a}
  function distance(a,b){var x=getXY(a),y=getXY(b);return Math.abs(x.r-y.r)+Math.abs(x.c-y.c)}
  function count(side){return board.filter(function(t){return t.owner===side}).length}
  function strengths(side){return board.reduce(function(n,t){return n+(t.owner===side?t.power:0)},0)}
  var BUILDINGS={
    fort:{icon:"🛡",name:"Festung",cost:4,desc:"+3 Verteidigung auf diesem Feld"},
    barracks:{icon:"⚔",name:"Kaserne",cost:6,desc:"Angriffe verbrauchen keine Stärke auf dem Ausgangsfeld"},
    hub:{icon:"🔮",name:"Machtzentrum",cost:7,desc:"+2 Angriff für benachbarte eigene Felder"},
    shield:{icon:"💠",name:"Schildgenerator",cost:7,desc:"+2 Verteidigung für benachbarte eigene Felder"},
    tower:{icon:"🏹",name:"Wachturm",cost:6,desc:"Angriff in gerader Linie aus 2 Feldern Entfernung"}
  };
  function ownSelection(){return selected!==null&&board[selected]&&board[selected].owner===turn}
  function myWarps(side){return board.map(function(t,i){return t.owner===side&&t.special==="warp"?i:-1}).filter(function(i){return i>=0})}
  function boostPrice(i,side){return BOOST_COST*(board[i].special==="warp"?myWarps(side).length:1)}
  function aPower(i){var t=board[i];return t.power+(neighbors(i).some(function(k){return board[k].owner===t.owner&&board[k].upgrade==="hub"})?2:0)}
  function dPower(i){var t=board[i];return t.power+(t.upgrade==="fort"?3:0)+(neighbors(i).some(function(k){return board[k].owner===t.owner&&board[k].upgrade==="shield"})?2:0)}
  function reach(i,type,side){
    var result=neighbors(i),p=getXY(i);
    if(board[i].special==="warp")myWarps(side).forEach(function(k){if(k!==i)result=result.concat(neighbors(k))});
    if(type==="attack"&&board[i].upgrade==="tower"){
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){
        var r=p.r+2*d[0],c=p.c+2*d[1],mr=p.r+d[0],mc=p.c+d[1];
        if(r<0||r>=ROWS||c<0||c>=COLS)return;
        var mid=board[mr*COLS+mc];
        if(!mid.rock&&mid.owner!==3-side)result.push(r*COLS+c);
      });
    }
    return Array.from(new Set(result));
  }
  function buildTargets(i,id,side){
    if(board[i].special!=="warp")return board[i].upgrade?[]:[i];
    var own=myWarps(side);
    if(own.some(function(k){return board[k].upgrade&&board[k].upgrade!==id}))return [];
    return own.filter(function(k){return !board[k].upgrade});
  }
  function income(side){return 2+board.reduce(function(n,t){return n+(t.owner===side&&t.special==="mine"?t.mineLevel:0)},0)}
  function mineCost(level){return [0,3,5,8][level]||Infinity}
  function playerName(side){return side===1?(mode==="local"?"BLAU":"DU"):(mode==="local"?"ROT":"KI")}
  function humanTurn(){return !locked&&!pendingTurn&&!gameOver&&(turn===1||mode==="local")}
  function showToast(msg){els.toast.textContent=msg;els.toast.classList.add("show");clearTimeout(timer);timer=setTimeout(function(){els.toast.classList.remove("show")},1800)}
  function sound(freq){if(mute)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.67,audio.currentTime+.13);g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}catch(e){}}
  function init(){gameToken++;board=Array.from({length:COLS*ROWS},function(_,i){return {owner:0,power:0,rock:rocks.indexOf(i)>=0,special:mines.includes(i)?"mine":treasures.includes(i)?"treasure":warps.includes(i)?"warp":null,mineLevel:1,claimed:false,base:0,upgrade:null}});
    board[43].owner=1;board[43].power=3;board[43].base=1;
    board[12].owner=2;board[12].power=3;board[12].base=2;
    coins={1:8,2:8};turn=1;round=1;selected=null;inspected=null;action="expand";locked=false;pendingTurn=false;gameOver=false;aiHasSpent=false;lastMove=-1;startAp();render();
  }
  function startAp(){pendingTurn=false;ap=(round===1&&turn===1)?1:2;maxAp=ap;aiHasSpent=false;if(!(round===1&&turn===1))coins[turn]+=income(turn)}
  function availableTargets(from,type,side){if(from===null||!board[from]||board[from].owner!==side)return[];
    return reach(from,type,side).filter(function(i){var t=board[i];if(t.rock)return false;if(type==="expand")return t.owner===0;if(type==="attack")return t.owner!==0&&t.owner!==side&&aPower(from)>dPower(i);return false})}
  function canMove(side,from,to,type){return board[from]&&board[from].owner===side&&availableTargets(from,type,side).indexOf(to)>=0}
  function move(side,from,to,type){
    if(gameOver||pendingTurn)return false;
    if(type==="boost"){
      if(!board[from]||board[from].owner!==side||coins[side]<boostPrice(from,side))return false;
      coins[side]-=boostPrice(from,side);
      if(board[from].special==="warp")myWarps(side).forEach(function(k){board[k].power++});
      else board[from].power++;
      lastMove=from;inspected=from;sound(480);render();return true;
    }
    if(ap<=0||!canMove(side,from,to,type))return false;
    var target=board[to];
    if(type==="attack"){if(board[from].upgrade!=="barracks")board[from].power=Math.max(1,board[from].power-1);target.owner=side;target.power=1;sound(310)}
    else{target.owner=side;target.power=1;sound(720)}
    lastMove=to;inspected=to;
    if(target.special==="treasure"&&!target.claimed){target.claimed=true;coins[side]+=5;showToast("Schatz gefunden: +5 Münzen!")}
    ap--;
    if(target.base&&target.base!==side){selected=null;render();finish(side,"HQ");return true}
    if(ap===0){selected=null;pendingTurn=true}
    else if(side===turn){selected=type==="expand"?to:from}
    render();return true;
  }
  function upgradeMine(){
    if(!humanTurn()||selected===null)return;
    var tile=board[selected];if(tile.owner!==turn||tile.special!=="mine")return;
    var cost=mineCost(tile.mineLevel);
    if(!isFinite(cost)){showToast("Mine bereits maximal ausgebaut.");return}
    if(coins[turn]<cost){showToast("Nicht genug Münzen für den Minenausbau.");return}
    coins[turn]-=cost;tile.mineLevel++;inspected=selected;lastMove=selected;sound(650);render();
  }
  function render(){
    var valid=humanTurn()&&ap>0?availableTargets(selected,action,turn):[];
    var html="";
    board.forEach(function(t,i){
      var owner=t.owner===1?"player":t.owner===2?"enemy":"neutral";
      var cls="tile "+(t.rock?"rock":owner)+(t.special==="warp"?" warp":"")+(selected===i&&humanTurn()?" selected":"")+(inspected===i&&!pendingTurn?" inspected":"")+(valid.indexOf(i)>=0?" legal":"")+(lastMove===i?" flash":"");
      var specialIcon=t.special==="mine"?"⛏":t.special==="treasure"?"✦":t.special==="warp"?"🌀":"";
      var inside=t.rock?"":'<span class="tile-power">'+(t.owner?t.power:"·")+'</span>'+(specialIcon?'<span class="tile-energy">'+specialIcon+(t.special==="mine"&&t.mineLevel>1?'<sup>'+t.mineLevel+'</sup>':"")+'</span>':"")+(t.base?'<span class="tile-base">◆</span>':"")+(t.upgrade?'<span class="tile-building">'+BUILDINGS[t.upgrade].icon+'</span>':"");
      var label=t.rock?"Felsen":owner+", Stärke "+t.power+(t.special?", "+(t.special==="mine"?"Mine Stufe "+t.mineLevel:t.special==="warp"?"Warpfeld":"Schatzfeld"):"")+(t.base?", Hauptquartier":"");
      html+='<button type="button" class="'+cls+'" data-i="'+i+'" aria-label="'+label+'" '+''+'>'+inside+'</button>';
    });
    els.board.innerHTML=html;
    byId("p-count").textContent=strengths(1);byId("e-count").textContent=strengths(2);byId("p-meta").textContent=count(1)+" Felder";byId("e-meta").textContent=count(2)+" Felder";byId("p-money").textContent="🪙 "+coins[1];byId("e-money").textContent="🪙 "+coins[2];byId("round").textContent=String(Math.min(round,MAX_ROUNDS)).padStart(2,"0");
    byId("p-name").textContent="◆ "+(mode==="ai"?"DU":"BLAU")+" · STÄRKE";
    byId("e-name").textContent="STÄRKE · "+(mode==="ai"?"KI":"ROT")+" ◆";
    byId("player-card").classList.toggle("current",turn===1&&!gameOver);
    byId("enemy-card").classList.toggle("current",turn===2&&!gameOver);
    byId("status").classList.toggle("enemy-turn",turn===2);
    var st="";
    if(gameOver)st="Partie beendet";
    else if(pendingTurn)st="Zug abgeschlossen. Gegner ist gleich dran …";
    else if(locked)st="Gegner denkt nach ...";
    else if(selected===null)st=playerName(turn)+": Wähle eines deiner Felder.";
    else if(action==="expand")st="Tippe auf ein markiertes Nachbarfeld.";
    else if(action==="attack")st="Wähle ein schwächeres gegnerisches Feld.";
    else st="Verstärken kostet 2 Münzen und keine Aktion.";
    byId("status-text").textContent=st;
    byId("ap").innerHTML=Array.from({length:maxAp},function(_,i){return '<span class="ap-pip '+(i<ap?"filled":"")+'"></span>'}).join("");
    byId("ap-label").textContent=ap+" ZUGAKTION"+(ap===1?"":"EN")+" ÜBRIG";
    byId("turn-label").textContent=gameOver?"SPIEL BEENDET":locked?"KI DENKT NACH":(turn===1?"BLAU AM ZUG":"ROT AM ZUG");
    ["expand","attack","boost"].forEach(function(type){var b=byId(type);b.classList.toggle("on",action===type);b.disabled=!humanTurn()||(type==="boost"?coins[turn]<BOOST_COST:ap<=0)});
    var mineBtn=byId("mine-upgrade");
    var ownMine=selected!==null&&board[selected].owner===turn&&board[selected].special==="mine"&&humanTurn();
    mineBtn.hidden=!ownMine;
    if(ownMine){var cost=mineCost(board[selected].mineLevel);mineBtn.textContent=isFinite(cost)?"⛏ Mine verbessern · "+cost+" 🪙":"⛏ Mine Stufe 4 (Max.)";mineBtn.disabled=!isFinite(cost)||coins[turn]<cost}
    byId("end-turn").disabled=!humanTurn();byId("build").disabled=!humanTurn();byId("boost-cost").textContent=(selected!==null&&board[selected].owner===turn?boostPrice(selected,turn):2)+" 🪙";if(selected!==null&&board[selected].owner===turn&&coins[turn]<boostPrice(selected,turn))byId("boost").disabled=true;renderInspector();
  }
  function clickTile(i){
    if(!humanTurn()){inspected=i;render();return}
    var t=board[i];
    if(t.owner===turn){selected=i;inspected=i;render();return}
    if(selected===null){inspected=i;render();showToast("Wähle zuerst eines deiner Felder.");return}
    if(action==="boost"){showToast("Wähle ein eigenes Feld zum Verstärken.");return}
    if(!move(turn,selected,i,action)){inspected=i;render();showToast(action==="expand"?"Nur angrenzende freie Felder!":"Angriff nur bei höherer Stärke!");return}
    if(!gameOver&&pendingTurn)scheduleNext();
  }
  function boost(){
    if(!humanTurn())return;
    action="boost";
    if(selected===null){showToast("Wähle zuerst ein eigenes Feld.");render();return}
    if(!move(turn,selected,null,"boost")){showToast("Verstärken kostet "+boostPrice(selected,turn)+" Münzen.");render();return}
  }
  function chooseAction(a){if(!humanTurn())return;if(a==="boost"){boost();return}action=a;render()}
  function renderInspector(){
    var t=inspected===null?null:board[inspected],title=byId("inspect-title"),desc=byId("inspect-desc");
    if(!t){title.textContent="Feld antippen";desc.textContent="Hier werden Spezialboni und Gebäude erklärt.";return}
    var p=getXY(inspected),pos=String.fromCharCode(65+p.c)+(p.r+1);
    title.textContent=pos+" · "+(t.rock?"Felsen":t.owner===0?"Neutral":t.owner===1?"Blau":"Rot")+(t.base?" · Basis":"");
    var bonus=t.special==="mine"?"⛏ Mine Stufe "+t.mineLevel+": +"+t.mineLevel+" Münzen pro Zug. ":t.special==="treasure"?(t.claimed?"✦ Schatz schon eingesammelt. ":"✦ Schatz: einmalig 5 Münzen bei erster Eroberung. "):t.special==="warp"?"🌀 Warpfeld: Alle eigenen Warpfelder sind verbunden. Eroberungen und Angriffe über das Netzwerk. Verstärken und Bauen gelten für alle mit Kosten pro Feld. ":"";
    desc.textContent=t.rock?"Unpassierbares Feld.":bonus+(t.owner?"Stärke "+t.power+", Angriff "+aPower(inspected)+", Verteidigung "+dPower(inspected)+". ":"Freies Feld. ")+(t.upgrade?BUILDINGS[t.upgrade].name+": "+BUILDINGS[t.upgrade].desc+".":"");
  }
  function openBuild(){
    if(!humanTurn())return;
    if(!ownSelection()){showToast("Wähle zuerst ein eigenes Feld, dann BAUEN.");return}
    var t=board[selected],p=getXY(selected),pos=String.fromCharCode(65+p.c)+(p.r+1);
    var html='<div class="eyebrow">WERKSTATT · '+pos+'</div><h1>GEBÄUDE <span>BAUEN</span></h1><p>🪙 Guthaben: '+coins[turn]+'. Pro Feld ist genau ein Gebäude erlaubt. Bauen verbraucht keine Kampfaktion.</p>';
    html+='<div class="build-list">'+Object.keys(BUILDINGS).map(function(id){
      var u=BUILDINGS[id],fields=buildTargets(selected,id,turn),cost=u.cost*fields.length,can=fields.length>0&&coins[turn]>=cost;
      return '<button type="button" class="build-item" data-build="'+id+'" '+(can?"":"disabled")+'><span class="build-ico">'+u.icon+'</span><span class="build-copy"><b>'+u.name+'</b><small>'+u.desc+'</small></span><strong>'+(cost||u.cost)+' 🪙</strong></button>';
    }).join("")+'</div>';
    if(t.special==="warp")html+='<p class="build-note">🌀 Alle kontrollierten Warpfelder bilden ein Netzwerk. Gebäude werden auf jedes noch freie Warpfeld übertragen. Der Preis gilt pro ausgebautem Warpfeld.</p>';
    if(t.upgrade)html+='<p class="build-note">Bestehendes Gebäude: '+BUILDINGS[t.upgrade].name+'. Andere Gebäude sind hier nicht möglich.</p>';
    html+='<button type="button" class="secondary-btn" id="close-build">SCHLIESSEN</button>';
    showModal(html);byId("close-build").addEventListener("click",hideModal);
  }
  function buildUpgrade(id){
    if(!humanTurn()||!ownSelection()||!BUILDINGS[id])return;
    var targets=buildTargets(selected,id,turn),price=targets.length*BUILDINGS[id].cost;
    if(!targets.length||coins[turn]<price)return;
    coins[turn]-=price;targets.forEach(function(i){board[i].upgrade=id});
    inspected=selected;lastMove=selected;sound(630);hideModal();render();showToast(BUILDINGS[id].icon+" "+BUILDINGS[id].name+" gebaut");
  }
  function scheduleNext(){var token=gameToken,side=turn;setTimeout(function(){if(gameToken===token&&turn===side&&!locked&&!gameOver&&pendingTurn)nextTurn()},390)}
  function nextTurn(){
    if(gameOver||locked)return;
    selected=null;action="expand";
    if(turn===1){turn=2;startAp();if(mode==="ai"){locked=true;render();var token=gameToken;setTimeout(function(){if(gameToken===token)aiStep()},520)}else render()}
    else{round++;if(round>MAX_ROUNDS){endByScore();return}turn=1;startAp();render()}
  }
  function endByScore(){
    var s1=strengths(1),s2=strengths(2),winner=s1===s2?0:(s1>s2?1:2);
    finish(winner,"score");
  }
  function finish(winner,reason){
    gameOver=true;locked=false;render();sound(winner===1?930:330);
    var title=winner===0?"UNENTSCHIEDEN":winner===1?"BLAU SIEGT!":(mode==="ai"?"DIE KI SIEGT!":"ROT SIEGT!");
    var detail=reason==="HQ"?"Das gegnerische Hauptquartier wurde erobert.":"Nach 15 Runden gewinnt die höhere Gesamtstärke.";
    var sub=winner===0?"Beide Seiten sind gleich stark.":(winner===1?"Das Feld gehört dir!":(mode==="ai"?"Nächstes Mal holst du dir das Feld.":"Rote Fraktion dominiert."));
    showModal('<div class="eyebrow">MATCH COMPLETE</div><div class="hero-emblem"><span>'+(winner===1?"★":winner===2?"✦":"=")+'</span></div><h1>'+title+'</h1><p>'+detail+'<br>'+sub+'</p><div class="result-score">'+strengths(1)+' <small>:</small> '+strengths(2)+'</div><button class="primary-btn" id="play-again">NOCHMAL SPIELEN</button><button class="secondary-btn" id="switch-mode">MODUS WECHSELN</button>');
    byId("play-again").addEventListener("click",function(){hideModal();init()});
    byId("switch-mode").addEventListener("click",welcome);
  }
  function aiCandidates(){
    var list=[];
    board.forEach(function(t,i){if(t.owner!==2)return;
      neighbors(i).forEach(function(j){var q=board[j];if(q.rock)return;
        if(q.owner===0){var sc=3.4+Math.max(0,9-distance(j,43))*.20+(q.special==="mine"?4.6:q.special==="warp"?4.5:q.special==="treasure"&&!q.claimed?3.8:0);
          if(neighbors(j).some(function(k){return board[k].owner===1}))sc+=.7;
          list.push({type:"expand",from:i,to:j,score:sc+Math.random()*1.5})}
        else if(q.owner===1&&aPower(i)>dPower(j)){list.push({type:"attack",from:i,to:j,score:10+(q.base?120:0)+(q.special==="mine"?5:0)+Math.random()*2})}
      });

    });
    list.sort(function(a,b){return b.score-a.score});return list;
  }
  function aiSpend(){
    if(aiHasSpent)return;aiHasSpent=true;
    var minesOwned=board.filter(function(t){return t.owner===2&&t.special==="mine"});
    for(var m of minesOwned){var cost=mineCost(m.mineLevel);if(round<12&&isFinite(cost)&&coins[2]>=cost+2){coins[2]-=cost;m.mineLevel++}}
    var candidates=board.map(function(t,i){return {t:t,i:i}}).filter(function(x){return x.t.owner===2})
      .sort(function(a,b){var sa=neighbors(a.i).filter(function(j){return !board[j].rock&&board[j].owner!==2}).length,sb=neighbors(b.i).filter(function(j){return !board[j].rock&&board[j].owner!==2}).length;return sb-sa});
    var buys=0;
    for(var x of candidates){if(coins[2]<BOOST_COST+2||buys>=2)break;
      if(neighbors(x.i).some(function(j){return !board[j].rock&&board[j].owner!==2})){
        coins[2]-=BOOST_COST;x.t.power++;buys++;
      }
    }
    render();
  }
  function aiStep(){
    if(gameOver||turn!==2)return;
    aiSpend();
    var possible=aiCandidates(),best=possible[0];
    if(ap<=0||!best){locked=false;nextTurn();return}
    move(2,best.from,best.to,best.type);
    if(gameOver)return;
    var token=gameToken;setTimeout(function(){if(gameToken===token)aiStep()},410);
  }
  function showModal(content){els.modal.innerHTML=content;els.overlay.classList.remove("hidden")}
  function hideModal(){els.overlay.classList.add("hidden")}
  function welcome(){
    showModal('<div class="hero-emblem"><span>T</span></div><div class="eyebrow">CONQUER THE GRID</div><h1>TERRITORY <span>CLASH</span></h1><p>Eine Karte. Zwei Fraktionen. Übernimm das Spielfeld und besiege deinen Gegner in 15 schnellen Runden.</p><div class="hero-facts"><span>✧ Ausbreiten</span><span>⚔ Angreifen</span><span>⬡ Verstärken</span></div><button class="primary-btn" id="start-ai">⚡ GEGEN KI SPIELEN</button><button class="secondary-btn" id="start-local">2 SPIELER · EIN HANDY</button><div class="fine">Blau startet mit 1 Eroberung oder Angriff. Danach jeweils 2. Verstärken kostet nur Münzen.</div>');
    byId("start-ai").addEventListener("click",function(){mode="ai";init();hideModal()});
    byId("start-local").addEventListener("click",function(){mode="local";init();hideModal()});
  }
  function rules(){
    showModal('<div class="eyebrow">SO FUNKTIONIERT ES</div><h1>SPIEL<span>REGELN</span></h1><div class="rules"><div><b>✧ Erobern:</b> Eigenes Feld antippen, dann ein angrenzendes freies Feld. Kostet 1 Aktion.</div><div><b>⚔ Angreifen:</b> Eigenes Feld wählen, Angriff aktivieren, schwächeres feindliches Nachbarfeld erobern. Die Stärke des Angreifers sinkt um 1.</div><div><b>⬡ Verstärken:</b> +1 Stärke für 2 Münzen, ohne Kampfaktion. Auf Warpfeldern werden alle eigenen Warpfelder verstärkt, 2 Münzen pro Feld. Keine Stärkeobergrenze.</div><div><b>⏱ Zugfolge:</b> Blau hat zuerst 1 Eroberung oder Angriff, danach alle jeweils 2. Nur diese beiden Aktionen zählen ins Zuglimit. Münzausgaben sind vorher beliebig möglich. Nach der letzten Kampfaktion wechselt der Zug automatisch.</div><div><b>⛏ Mine:</b> +1 Münze pro Stufe je Zug, ausbaubar auf Stufe 4. <b>✦ Schatz:</b> Erste Eroberung +5 Münzen.</div><div><b>🌀 Warpfelder:</b> Vier auf der Karte, alle eigenen sind miteinander verbunden. Über sie kann man aus der Ferne angreifen oder erobern. Ausbau oder Verstärken wird auf alle kontrollierten Warpfelder übertragen, Kosten je Feld.</div><div><b>⌂ Gebäude:</b> Höchstens eines pro Feld. Festung, Kaserne, Machtzentrum, Schildgenerator und Wachturm, alle für Münzen. Im Baumenü stehen die Effekte und Preise.</div><div><b>◆ Sieg:</b> Erobere das gegnerische Hauptquartier oder besitze nach 15 Runden mehr Gesamtstärke (Summe aller eigenen Feldstärken). Keine Siegpunkte.</div></div><button class="primary-btn" id="rules-close">VERSTANDEN</button>');
    byId("rules-close").addEventListener("click",hideModal);
  }
  els.board.addEventListener("click",function(e){var cell=e.target.closest("[data-i]");if(cell)clickTile(Number(cell.dataset.i))});
  byId("expand").addEventListener("click",function(){chooseAction("expand")});
  byId("attack").addEventListener("click",function(){chooseAction("attack")});
  byId("boost").addEventListener("click",function(){chooseAction("boost")});
  byId("mine-upgrade").addEventListener("click",upgradeMine);
  byId("build").addEventListener("click",openBuild);
  byId("inspect-more").addEventListener("click",function(){
    if(inspected===null){showToast("Tippe zuerst auf ein Feld.");return}
    var t=board[inspected],p=getXY(inspected),name=String.fromCharCode(65+p.c)+(p.r+1);
    var title=t.rock?"Felsen":t.special==="mine"?"Goldmine":t.special==="treasure"?"Schatzfeld":t.special==="warp"?"Warpfeld":t.base?"Hauptquartier":"Normales Feld";
    var info=t.rock?"Unpassierbar.":t.special==="mine"?"Produziert Münzen pro eigenem Zug. Aktuell Stufe "+t.mineLevel+". Mit Münzen auf Stufe 2, 3 und 4 aufrüstbar.":t.special==="treasure"?"Einmalig 5 Münzen für die Fraktion, die dieses Feld als erste erobert.":t.special==="warp"?"Vier Warpfelder befinden sich auf der Karte. Alle vom selben Spieler kontrollierten Warpfelder sind miteinander verbunden. Über jedes davon lassen sich von einem eigenen Warpfeld aus freie Nachbarfelder aller verbundenen Warpfelder erobern und gegnerische Nachbarfelder angreifen. Wird ein Warpfeld verstärkt oder mit einem Gebäude verbessert, wird dieselbe Verbesserung auf alle kontrollierten Warpfelder übertragen, mit Münzkosten pro betroffenem Feld.": "Normales Gebiet mit Stärke und optional einem Gebäude.";
    if(t.upgrade)info+=" Vorhandenes Gebäude: "+BUILDINGS[t.upgrade].name+". "+BUILDINGS[t.upgrade].desc+".";
    var html='<div class="eyebrow">FELD '+name+'</div><h1>'+title.toUpperCase()+'</h1><p>'+info+'</p><button class="primary-btn" id="field-close">VERSTANDEN</button>';
    showModal(html);byId("field-close").addEventListener("click",hideModal);
  });
  els.modal.addEventListener("click",function(e){var b=e.target.closest("[data-build]");if(b&&!b.disabled)buildUpgrade(b.dataset.build)});
  byId("end-turn").addEventListener("click",nextTurn);
  byId("info").addEventListener("click",rules);
  byId("restart").addEventListener("click",welcome);
  byId("sound").addEventListener("click",function(){mute=!mute;this.textContent=mute?"♪":"♫";this.style.color=mute?"":"#5ff6df";sound(670)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!els.overlay.classList.contains("hidden"))hideModal()});
  init();welcome();
})();
</script>
